spring:
  ai:
    openai:
      api-key: ${openai.key}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.3

  config:
    import:
      - aws-parameterstore:/config/flint-api/
      - aws-parameterstore:/config/flint-api/prod/

  datasource:
    url: ${database.url}
    username: ${database.username}
    password: ${database.password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    show-sql: false

  data:
    redis:
      host: ${redis.host}
      port: ${redis.port:6379}
      password: ${redis.password:}
      database: ${redis.database:0}

decorator:
  datasource:
    p6spy:
      enable-logging: false

cloud:
  aws:
    s3:
      bucket: ${s3.bucket}
      region: ap-northeast-2
      presign-expiration: 10m
    cloudfront:
      enabled: true
      url: ${cloudfront.url}

jwt:
  secret: ${jwt.secret}
  access-expiration: 1h
  refresh-expiration: 14d
  temp-expiration: 30m

oauth:
  kakao:
    client-id: ${oauth.kakao.client-id}
    client-secret: ${oauth.kakao.client-secret}
    redirect-uri: ${oauth.kakao.redirect-uri}
    token-url: https://kauth.kakao.com/oauth/token
    user-info-url: https://kapi.kakao.com/v2/user/me
    connect-timeout: 5s
    read-timeout: 10s

logging:
  level:
    kr.flint: info

tmdb:
  base-url: https://api.themoviedb.org
  api-key: ${tmdb.api-key}
