spring:
  config:
    import: aws-parameterstore:/config/flint-api/

  datasource:
    url: ${database.url}
    username: ${database.username}
    password: ${database.password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    show-sql: false

decorator:
  datasource:
    p6spy:
      enable-logging: false

cloud:
  aws:
    s3:
      bucket: ${s3.bucket}
      region: ${s3.region:ap-northeast-2}
      presign-expiration: 10m

jwt:
  secret: ${jwt.secret}
  access-expiration: 1h
  refresh-expiration: 14d
  temp-expiration: 30m

oauth:
  kakao:
    client-id: ${oauth.kakao.client-id}
    client-secret: ${oauth.kakao.client-secret}
    redirect-uri: ${oauth.kakao.redirect-uri}
    token-url: https://kauth.kakao.com/oauth/token
    user-info-url: https://kapi.kakao.com/v2/user/me
    connect-timeout: 5s
    read-timeout: 10s

logging:
  level:
    kr.flint: info
