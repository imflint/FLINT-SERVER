spring:
  ai:
    openai:
      api-key: ${openai.key}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.3

  config:
    import:
      - aws-parameterstore:/config/flint-api/
      - aws-parameterstore:/config/flint-api/dev/

  datasource:
    url: ${database.url}
    username: ${database.username}
    password: ${database.password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  data:
    redis:
      host: localhost
      port: 6379

decorator:
  datasource:
    p6spy:
      enable-logging: true
      multiline: true
      logging: slf4j

cloud:
  aws:
    s3:
      bucket: ${s3.bucket}
      region: ap-northeast-2
      presign-expiration: 10m

jwt:
  secret: ${jwt.secret}
  access-expiration: 14d
  refresh-expiration: 30d
  temp-expiration: 30m

oauth:
  kakao:
    client-id: ${oauth.kakao.client-id}
    client-secret: ${oauth.kakao.client-secret}
    redirect-uri: ${oauth.kakao.redirect-uri}
    token-url: https://kauth.kakao.com/oauth/token
    user-info-url: https://kapi.kakao.com/v2/user/me
    connect-timeout: 5s
    read-timeout: 10s

logging:
  level:
    kr.flint: debug
