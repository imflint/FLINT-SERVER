spring:
  ai:
    openai:
      api-key: ${openai.key}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.3

  config:
    import:
      - aws-parameterstore:/config/flint-api/
      - aws-parameterstore:/config/flint-api/dev/

  datasource:
    url: ${database.url}
    username: ${database.username}
    password: ${database.password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  data:
    redis:
      host: localhost
      port: 6379

decorator:
  datasource:
    p6spy:
      enable-logging: true
      multiline: false
      logging: slf4j
      exclude-categories:
        - info
        - debug
        - result
        - resultset
        - commit
        - rollback

cloud:
  aws:
    s3:
      bucket: ${s3.bucket}
      region: ap-northeast-2
      presign-expiration: 10m
    cloudfront:
      enabled: true
      url: ${cloudfront.url}

jwt:
  secret: ${jwt.secret}
  access-expiration: 1400000000000000000
  refresh-expiration: 9000000000000000000
  temp-expiration: 9000000000000000000

oauth:
  kakao:
    client-id: ${oauth.kakao.client-id}
    client-secret: ${oauth.kakao.client-secret}
    redirect-uri: ${oauth.kakao.redirect-uri}
    token-url: https://kauth.kakao.com/oauth/token
    user-info-url: https://kapi.kakao.com/v2/user/me
    connect-timeout: 5s
    read-timeout: 10s
  apple:
    client-id: ${oauth.apple.client-id}
    jwks-url: https://appleid.apple.com/auth/keys
    connect-timeout: 5s
    read-timeout: 10s
    jwks-cache-ttl: 24h

logging:
  level:
    kr.flint: info
    org.hibernate.SQL: warn
    org.hibernate.orm.jdbc.bind: warn

flint:
  logging:
    sql:
      slow-query-threshold-ms: 500
      stack:
        allow-prefixes: kr.flint
        deny-prefixes: kr.flint.shared.p6spy,kr.flint.shared.config.P6spyConfig
        max-depth: 5

discord:
