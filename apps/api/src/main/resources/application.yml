spring:
  application:
    name: flint-api

  profiles:
    default: local

  config:
    import:
      - optional:file:.env[.properties]

  threads:
    virtual:
      enabled: true

  lifecycle:
    timeout-per-shutdown-phase: 330s

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        default_batch_fetch_size: 100
        jdbc:
          time_zone: Asia/Seoul

  jackson:
    default-property-inclusion: non_null

  batch:
    jdbc:
      initialize-schema: always
      schema: classpath:batch-schema-mysql.sql
    job:
      enabled: false

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: framework

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    disable-swagger-default-url: true
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: never

decorator:
  datasource:
    p6spy:
      enable-logging: false
      multiline: true
      logging: slf4j

recommendation:
  strategy: fliner-keyword  # fliner-keyword | fliner-collection

tmdb:
  base-url: https://api.themoviedb.org
  api-key: ${TMDB_API_KEY:}
  requests-per-second: 5

flint:
  exploration:
    snapshot-enabled: ${FLINT_EXPLORATION_SNAPSHOT_ENABLED:false}
  content:
    localized-search-enabled: ${FLINT_LOCALIZED_SEARCH_ENABLED:false}
  batch:
    scheduling:
      enabled: false
    s3-cleanup:
      enabled: false
    tmdb:
      export-base-url: https://files.tmdb.org/p/exports
      download-dir: ${java.io.tmpdir}/flint-tmdb-exports
      chunk-size: 50
      concurrency-limit: 3
      retry-attempts: 3
      retry-back-off-ms: 2000
