spring:
  cloud:
    aws:
      parameterstore:
        enabled: false

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}

decorator:
  datasource:
    p6spy:
      enable-logging: true
      multiline: true
      logging: slf4j

p6spy:
  filter:
    allow:
      - kr.flint
    deny:
      - kr.flint.shared

cloud:
  aws:
    parameterstore:
      enabled: false
    secretsmanager:
      enabled: false
    s3:
      bucket: ${S3_BUCKET}
      region: ${S3_REGION}
      access-key: ${S3_ACCESS_KEY}
      secret-key: ${S3_SECRET_KEY}
      presign-expiration: 10m

jwt:
  secret: ${JWT_SECRET:local-dev-secret-key-at-least-32-characters-long}
  access-expiration: 5m
  refresh-expiration: 14d
  temp-expiration: 30m

oauth:
  kakao:
    client-id: ${KAKAO_CLIENT_ID}
    client-secret: ${KAKAO_CLIENT_SECRET}
    redirect-uri: ${KAKAO_LOCAL_REDIRECT_URI}
    token-url: https://kauth.kakao.com/oauth/token
    user-info-url: https://kapi.kakao.com/v2/user/me
    connect-timeout: 5s
    read-timeout: 10s

logging:
  level:
    kr.flint: debug
