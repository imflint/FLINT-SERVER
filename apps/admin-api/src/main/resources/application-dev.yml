spring:
  config:
    import:
      - aws-parameterstore:/config/flint-api/
      - aws-parameterstore:/config/flint-api/dev/

  datasource:
    url: ${database.url}
    username: ${database.username}
    password: ${database.password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  data:
    redis:
      host: localhost
      port: 6379

cloud:
  aws:
    s3:
      bucket: ${s3.bucket}
      region: ${s3.region:ap-northeast-2}
      presign-expiration: 10m
    cloudfront:
      enabled: true
      url: ${cloudfront.url}

decorator:
  datasource:
    p6spy:
      enable-logging: true
      multiline: false
      logging: slf4j
      exclude-categories:
        - info
        - debug
        - result
        - resultset
        - commit
        - rollback

jwt:
  secret: ${jwt.secret}
  access-expiration: 1400000000000000000
  refresh-expiration: 9000000000000000000
  temp-expiration: 9000000000000000000

tmdb:
  base-url: https://api.themoviedb.org
  api-key: ${tmdb.api-key}

logging:
  level:
    kr.flint: info
    org.hibernate.SQL: warn
    org.hibernate.orm.jdbc.bind: warn

flint:
  logging:
    sql:
      slow-query-threshold-ms: 1000
      stack:
        allow-prefixes: kr.flint
        deny-prefixes: kr.flint.shared.p6spy,kr.flint.shared.config.P6spyConfig
        max-depth: 5
