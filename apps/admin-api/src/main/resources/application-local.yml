spring:
  cloud:
    aws:
      parameterstore:
        enabled: false

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}

cloud:
  aws:
    parameterstore:
      enabled: false
    secretsmanager:
      enabled: false
    s3:
      bucket: ${S3_BUCKET:local-bucket}
      region: ${AWS_REGION:ap-northeast-2}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
      presign-expiration: 10m
    cloudfront:
      enabled: false
      url: ${CLOUDFRONT_URL:}

decorator:
  datasource:
    p6spy:
      enable-logging: true
      multiline: true
      logging: slf4j

p6spy:
  filter:
    allow:
      - kr.flint
    deny:
      - kr.flint.shared

jwt:
  secret: ${JWT_SECRET:local-dev-secret-key-at-least-32-characters-long}
  access-expiration: 14d
  refresh-expiration: 30d
  temp-expiration: 30m

tmdb:
  base-url: https://api.themoviedb.org
  api-key: ${TMDB_API_KEY}

logging:
  level:
    kr.flint: debug
