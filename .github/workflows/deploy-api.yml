name: Deploy API

on:
  push:
    branches: [release]
    paths:
      - 'apps/api/**'
      - 'modules/**'
      - 'infra/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradlew'
      - 'scripts/deploy.sh'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-api-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ap-northeast-2
  API_DEPLOY_PREFIX: deploy/flint-api
  DOCKER_PLATFORM: linux/arm64

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    env:
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      ECR_REPOSITORY_URI: ${{ vars.ECR_REPOSITORY_URI }}
      API_HEALTH_CHECK_URL: ${{ vars.API_HEALTH_CHECK_URL }}
      API_DOMAIN_NAME: ${{ vars.API_DOMAIN_NAME || 'flint.r-e.kr' }}
      ENABLE_SSL: ${{ vars.ENABLE_SSL || 'true' }}
      CERTBOT_EMAIL: ${{ vars.CERTBOT_EMAIL }}
      S3_DEPLOY_BUCKET: ${{ vars.S3_DEPLOY_BUCKET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Validate AWS variables
        run: |
          test -n "${AWS_ROLE_ARN}" || { echo "AWS_ROLE_ARN repository variable is required"; exit 1; }
          test -n "${EC2_INSTANCE_ID}" || { echo "EC2_INSTANCE_ID repository variable is required"; exit 1; }
          test -n "${ECR_REPOSITORY_URI}" || { echo "ECR_REPOSITORY_URI repository variable is required"; exit 1; }
          test -n "${S3_DEPLOY_BUCKET}" || { echo "S3_DEPLOY_BUCKET repository variable is required"; exit 1; }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: flint-api-${{ github.run_id }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and publish API image
        run: |
          image_uri="${ECR_REPOSITORY_URI}:sha-${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}"
          ./gradlew :apps:api:bootBuildImage \
            --imageName="${image_uri}" \
            --publishImage \
            --imagePlatform="${DOCKER_PLATFORM}" \
            --build-cache
          echo "IMAGE_URI=${image_uri}" >> "$GITHUB_ENV"

      - name: Upload API deploy script to S3
        run: aws s3 cp "scripts/deploy.sh" "s3://${S3_DEPLOY_BUCKET}/${API_DEPLOY_PREFIX}/${GITHUB_SHA}/deploy.sh"

      - name: Run API blue-green deployment with SSM
        run: |
          cat > ssm-parameters.json <<EOF
          {
            "commands": [
              "set -euo pipefail",
              "mkdir -p /home/ubuntu/deploy",
              "aws s3 cp \"s3://${S3_DEPLOY_BUCKET}/${API_DEPLOY_PREFIX}/${GITHUB_SHA}/deploy.sh\" \"/home/ubuntu/deploy.sh\"",
              "chmod +x /home/ubuntu/deploy.sh",
              "DEPLOY_MODE=docker IMAGE_URI=\"${IMAGE_URI}\" AWS_REGION=\"${AWS_REGION}\" API_DOMAIN_NAME=\"${API_DOMAIN_NAME}\" ENABLE_SSL=\"${ENABLE_SSL}\" CERTBOT_EMAIL=\"${CERTBOT_EMAIL}\" /home/ubuntu/deploy.sh"
            ]
          }
          EOF

          command_id=$(aws ssm send-command \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy flint-api ${GITHUB_SHA}" \
            --parameters file://ssm-parameters.json \
            --timeout-seconds 900 \
            --query "Command.CommandId" \
            --output text)

          status="Pending"
          for _ in {1..90}; do
            status=$(aws ssm get-command-invocation \
              --command-id "${command_id}" \
              --instance-id "${EC2_INSTANCE_ID}" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            case "${status}" in
              Success|Cancelled|Cancelling|Failed|TimedOut)
                break
                ;;
              *)
                sleep 10
                ;;
            esac
          done

          aws ssm get-command-invocation \
            --command-id "${command_id}" \
            --instance-id "${EC2_INSTANCE_ID}" \
            --query "StandardOutputContent" \
            --output text

          if [ "${status}" != "Success" ]; then
            aws ssm get-command-invocation \
              --command-id "${command_id}" \
              --instance-id "${EC2_INSTANCE_ID}" \
              --query "StandardErrorContent" \
              --output text >&2
            exit 1
          fi

          if [ -n "${API_HEALTH_CHECK_URL:-}" ]; then
            if ! curl --fail --silent --show-error --max-time 15 "${API_HEALTH_CHECK_URL}"; then
              exit 1
            fi
          fi
