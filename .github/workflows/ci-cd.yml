name: CI/CD

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ap-northeast-2
  API_DEPLOY_PREFIX: deploy/flint-api
  ADMIN_DEPLOY_PREFIX: deploy/flint-admin-api
  DOCKER_PLATFORM: linux/arm64

jobs:
  # PR에서만 테스트 실행
  test:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: flint_test
          MYSQL_USER: test
          MYSQL_PASSWORD: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and Test
        run: ./gradlew :apps:api:build :apps:admin-api:build :apps:batch:build --parallel --build-cache
        env:
          DB_URL: jdbc:mysql://localhost:3306/flint_test
          DB_USERNAME: test
          DB_PASSWORD: test

  # develop push 시 API/Admin 빌드 + 배포
  build:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      id-token: write
    env:
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      ECR_REPOSITORY_URI: ${{ vars.ECR_REPOSITORY_URI }}
      ADMIN_ECR_REPOSITORY_URI: ${{ vars.ADMIN_ECR_REPOSITORY_URI }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Validate AWS image variables
        run: |
          test -n "${AWS_ROLE_ARN}" || { echo "AWS_ROLE_ARN repository variable is required"; exit 1; }
          test -n "${ECR_REPOSITORY_URI}" || { echo "ECR_REPOSITORY_URI repository variable is required"; exit 1; }
          test -n "${ADMIN_ECR_REPOSITORY_URI}" || { echo "ADMIN_ECR_REPOSITORY_URI repository variable is required"; exit 1; }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: flint-build-${{ github.run_id }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and publish API image
        run: |
          image_uri="${ECR_REPOSITORY_URI}:sha-${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}"
          ./gradlew :apps:api:bootBuildImage \
            --imageName="${image_uri}" \
            --publishImage \
            --imagePlatform="${DOCKER_PLATFORM}" \
            --environment BP_JVM_VERSION=21 \
            --build-cache
          echo "API_IMAGE_URI=${image_uri}" >> "$GITHUB_ENV"

      - name: Build and publish Admin image
        run: |
          image_uri="${ADMIN_ECR_REPOSITORY_URI}:sha-${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}"
          ./gradlew :apps:admin-api:bootBuildImage \
            --imageName="${image_uri}" \
            --publishImage \
            --imagePlatform="${DOCKER_PLATFORM}" \
            --environment BP_JVM_VERSION=21 \
            --build-cache
          echo "ADMIN_IMAGE_URI=${image_uri}" >> "$GITHUB_ENV"

      - name: Stage deployment files
        run: |
          mkdir -p dist
          cp scripts/deploy.sh dist/deploy.sh
          cp scripts/deploy-admin.sh dist/deploy-admin.sh
          printf 'API_IMAGE_URI=%s\nADMIN_IMAGE_URI=%s\n' \
            "${API_IMAGE_URI}" \
            "${ADMIN_IMAGE_URI}" > dist/image-uris.env

      - name: Upload deploy artifact
        uses: actions/upload-artifact@v4
        with:
          name: flint-deploy
          path: dist/*
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      id-token: write
    env:
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      ADMIN_EC2_INSTANCE_ID: ${{ vars.ADMIN_EC2_INSTANCE_ID }}
      S3_DEPLOY_BUCKET: ${{ vars.S3_DEPLOY_BUCKET }}

    steps:
      - name: Download deploy artifact
        uses: actions/download-artifact@v4
        with:
          name: flint-deploy
          path: artifact

      - name: Validate AWS deploy variables
        run: |
          test -n "${AWS_ROLE_ARN}" || { echo "AWS_ROLE_ARN repository variable is required"; exit 1; }
          test -n "${EC2_INSTANCE_ID}" || { echo "EC2_INSTANCE_ID repository variable is required"; exit 1; }
          test -n "${ADMIN_EC2_INSTANCE_ID}" || { echo "ADMIN_EC2_INSTANCE_ID repository variable is required"; exit 1; }
          test -n "${S3_DEPLOY_BUCKET}" || { echo "S3_DEPLOY_BUCKET repository variable is required"; exit 1; }
          test -f artifact/image-uris.env || { echo "image-uris.env artifact is required"; exit 1; }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: flint-api-${{ github.run_id }}

      - name: Load image URIs
        run: |
          source artifact/image-uris.env
          test -n "${API_IMAGE_URI}" || { echo "API_IMAGE_URI is required"; exit 1; }
          test -n "${ADMIN_IMAGE_URI}" || { echo "ADMIN_IMAGE_URI is required"; exit 1; }
          echo "API_IMAGE_URI=${API_IMAGE_URI}" >> "$GITHUB_ENV"
          echo "ADMIN_IMAGE_URI=${ADMIN_IMAGE_URI}" >> "$GITHUB_ENV"

      - name: Upload deploy files to S3
        run: |
          aws s3 cp "artifact/deploy.sh" "s3://${S3_DEPLOY_BUCKET}/${API_DEPLOY_PREFIX}/${GITHUB_SHA}/deploy.sh"
          aws s3 cp "artifact/deploy-admin.sh" "s3://${S3_DEPLOY_BUCKET}/${ADMIN_DEPLOY_PREFIX}/${GITHUB_SHA}/deploy-admin.sh"

      - name: Run API blue-green deployment with SSM
        run: |
          cat > ssm-parameters.json <<EOF
          {
            "commands": [
              "set -euo pipefail",
              "mkdir -p /home/ubuntu/deploy",
              "aws s3 cp \"s3://${S3_DEPLOY_BUCKET}/${API_DEPLOY_PREFIX}/${GITHUB_SHA}/deploy.sh\" \"/home/ubuntu/deploy.sh\"",
              "chmod +x /home/ubuntu/deploy.sh",
              "DEPLOY_MODE=docker IMAGE_URI=\"${API_IMAGE_URI}\" AWS_REGION=\"${AWS_REGION}\" /home/ubuntu/deploy.sh"
            ]
          }
          EOF

          command_id=$(aws ssm send-command \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy flint-api ${GITHUB_SHA}" \
            --parameters file://ssm-parameters.json \
            --timeout-seconds 900 \
            --query "Command.CommandId" \
            --output text)

          status="Pending"
          for _ in {1..90}; do
            status=$(aws ssm get-command-invocation \
              --command-id "${command_id}" \
              --instance-id "${EC2_INSTANCE_ID}" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            case "${status}" in
              Success|Cancelled|Cancelling|Failed|TimedOut)
                break
                ;;
              *)
                sleep 10
                ;;
            esac
          done

          aws ssm get-command-invocation \
            --command-id "${command_id}" \
            --instance-id "${EC2_INSTANCE_ID}" \
            --query "StandardOutputContent" \
            --output text

          if [ "${status}" != "Success" ]; then
            aws ssm get-command-invocation \
              --command-id "${command_id}" \
              --instance-id "${EC2_INSTANCE_ID}" \
              --query "StandardErrorContent" \
              --output text >&2
            exit 1
          fi

      - name: Run Admin deployment with SSM
        run: |
          cat > ssm-parameters.json <<EOF
          {
            "commands": [
              "set -euo pipefail",
              "mkdir -p /home/ubuntu/deploy",
              "aws s3 cp \"s3://${S3_DEPLOY_BUCKET}/${ADMIN_DEPLOY_PREFIX}/${GITHUB_SHA}/deploy-admin.sh\" \"/home/ubuntu/deploy-admin.sh\"",
              "chmod +x /home/ubuntu/deploy-admin.sh",
              "DEPLOY_MODE=docker IMAGE_URI=\"${ADMIN_IMAGE_URI}\" AWS_REGION=\"${AWS_REGION}\" /home/ubuntu/deploy-admin.sh"
            ]
          }
          EOF

          command_id=$(aws ssm send-command \
            --instance-ids "${ADMIN_EC2_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy flint-admin-api ${GITHUB_SHA}" \
            --parameters file://ssm-parameters.json \
            --timeout-seconds 900 \
            --query "Command.CommandId" \
            --output text)

          status="Pending"
          for _ in {1..90}; do
            status=$(aws ssm get-command-invocation \
              --command-id "${command_id}" \
              --instance-id "${ADMIN_EC2_INSTANCE_ID}" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            case "${status}" in
              Success|Cancelled|Cancelling|Failed|TimedOut)
                break
                ;;
              *)
                sleep 10
                ;;
            esac
          done

          aws ssm get-command-invocation \
            --command-id "${command_id}" \
            --instance-id "${ADMIN_EC2_INSTANCE_ID}" \
            --query "StandardOutputContent" \
            --output text

          if [ "${status}" != "Success" ]; then
            aws ssm get-command-invocation \
              --command-id "${command_id}" \
              --instance-id "${ADMIN_EC2_INSTANCE_ID}" \
              --query "StandardErrorContent" \
              --output text >&2
            exit 1
          fi
