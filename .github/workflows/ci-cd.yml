name: CI/CD

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:  # 수동 실행 허용

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: flint_test
          MYSQL_USER: test
          MYSQL_PASSWORD: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew :apps:api:build -x test

      - name: Run tests
        run: ./gradlew test
        env:
          DB_URL: jdbc:mysql://localhost:3306/flint_test
          DB_USERNAME: test
          DB_PASSWORD: test

      - name: Build bootJar
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: ./gradlew :apps:api:bootJar

      - name: Upload JAR artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: apps/api/build/libs/flint-api-0.0.1-SNAPSHOT.jar
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    steps:
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar

      - name: Deploy to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "flint-api-0.0.1-SNAPSHOT.jar"
          target: "/home/ubuntu"

      - name: Restart application
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu

            # 기존 JAR 백업
            if [ -f flint-api-0.0.1-SNAPSHOT.jar ]; then
              cp flint-api-0.0.1-SNAPSHOT.jar flint-api-backup.jar
            fi

            # 새 JAR로 교체 (SCP로 업로드된 파일)
            # 기존 프로세스 종료
            pkill -f 'flint-api.*\.jar' || true
            sleep 2

            # 새 애플리케이션 실행
            nohup java -jar flint-api-0.0.1-SNAPSHOT.jar --spring.profiles.active=dev > app.log 2>&1 &

            # 시작 확인 (최대 30초 대기)
            for i in {1..6}; do
              sleep 5
              if curl -sf http://localhost:8080/actuator/health > /dev/null 2>&1; then
                echo "Application started successfully"
                exit 0
              fi
              echo "Waiting for application to start... ($i/6)"
            done

            # 실패 시 롤백
            echo "Deployment failed, rolling back..."
            pkill -f 'flint-api.*\.jar' || true
            sleep 2

            if [ -f flint-api-backup.jar ]; then
              cp flint-api-backup.jar flint-api-0.0.1-SNAPSHOT.jar
              nohup java -jar flint-api-0.0.1-SNAPSHOT.jar --spring.profiles.active=dev > app.log 2>&1 &
              echo "Rolled back to previous version"
            fi

            tail -50 app.log
            exit 1
