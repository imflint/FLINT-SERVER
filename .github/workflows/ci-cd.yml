name: CI/CD

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

jobs:
  # PR에서만 테스트 실행
  test:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: flint_test
          MYSQL_USER: test
          MYSQL_PASSWORD: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and Test
        run: ./gradlew :apps:api:build :apps:admin-api:build :apps:batch:build --parallel --build-cache
        env:
          DB_URL: jdbc:mysql://localhost:3306/flint_test
          DB_USERNAME: test
          DB_PASSWORD: test

  # develop push 시 빌드 + 배포
  build:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build bootJar
        run: ./gradlew :apps:api:bootJar :apps:admin-api:bootJar :apps:batch:bootJar -x test --parallel --build-cache

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: |
            apps/api/build/libs/flint-api-0.0.1-SNAPSHOT.jar
            apps/admin-api/build/libs/flint-admin-api-0.0.1-SNAPSHOT.jar
            apps/batch/build/libs/flint-batch-0.0.1-SNAPSHOT.jar
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout for deploy script
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: artifact

      - name: Prepare deployment files
        run: |
          mkdir -p deploy-files
          API_JAR="$(find artifact -name 'flint-api-0.0.1-SNAPSHOT.jar' -type f | head -n 1)"
          if [ -z "$API_JAR" ]; then
            echo "flint-api JAR not found in downloaded artifact"
            find artifact -maxdepth 5 -type f
            exit 1
          fi
          cp "$API_JAR" deploy-files/flint-api-0.0.1-SNAPSHOT.jar

          BATCH_JAR="$(find artifact -name 'flint-batch-0.0.1-SNAPSHOT.jar' -type f | head -n 1)"
          if [ -n "$BATCH_JAR" ]; then
            cp "$BATCH_JAR" deploy-files/flint-batch-0.0.1-SNAPSHOT.jar
          else
            echo "WARN: flint-batch JAR not found — batch deploy will be skipped on EC2"
          fi
          ls -la deploy-files

      - name: Deploy JARs to EC2
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "deploy-files/*"
          target: "/home/ubuntu/deploy"
          strip_components: 1

      - name: Deploy script to EC2
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "scripts/deploy.sh"
          target: "/home/ubuntu"
          strip_components: 1

      - name: Run Blue-Green deployment
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p /home/ubuntu/deploy
            chmod +x /home/ubuntu/deploy.sh
            /home/ubuntu/deploy.sh
